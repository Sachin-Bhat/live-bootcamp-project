services:
  app-service:
    # DONE: change "letsgetrusty" to your Docker Hub username
    image: sbhat17/app-service # specify name of image on Docker Hub
    restart: "always" # automatically restart container when server crashes
    environment: # set up environment variables
      AUTH_SERVICE_IP: ${AUTH_SERVICE_IP:-localhost} # Use localhost as the default value
      AUTH_SERVICE_HOST_NAME: ${AUTH_SERVICE_HOST_NAME:-auth-service}
    ports:
      - "8000:8000" # expose port 8000 so that applications outside the container can connect to it
    depends_on: # only run app-service after auth-service has started
      auth-service:
        condition: service_started
  auth-service:
    # DONE: change "letsgetrusty" to your Docker Hub username
    image: sbhat17/auth-service
    restart: "always" # automatically restart container when server crashes
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DROPLET_IP: ${DROPLET_IP:-localhost}
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432"
      POSTMARK_AUTH_TOKEN: ${POSTMARK_AUTH_TOKEN}
    ports:
      - "3000:3000" # expose port 3000 so that applications outside the container can connect to it
    depends_on:
      - db
  db:
    image: postgres:18.3-alpine3.23
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
    driver: local
